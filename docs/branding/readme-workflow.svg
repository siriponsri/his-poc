<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc">
<title id="title">CareBalance source-bound AI workflow</title><desc id="desc">An authenticated staff member selects a visit. Role-authorized sources are collected with omissions disclosed. AI prepares a source-linked artifact. A person reviews evidence and edits a draft, then explicitly applies permitted draft or follow-up effects. Version checks, audit and idempotency bind the save. An opt-in bounded watch triggers only on eligible source changes. Invalid or unknown work remains recorded, without automatic retries.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8090a5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1440" height="570" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="60" y="58" fill="#1c4286" font-size="15" font-weight="700" text-anchor="start">AI PREPARES. STAFF REVIEW AND DECIDE.</text>
<text x="60" y="104" fill="#202b3a" font-size="35" font-weight="600" text-anchor="start">From source record to the next piece of work</text>
<circle cx="80" cy="173" r="20" fill="#1c4286" stroke="none" stroke-width="1"/>
<text x="80" y="180" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">1</text>
<text x="60" y="232" fill="#202b3a" font-size="23" font-weight="600" text-anchor="start">Choose context</text>
<text x="60" y="268" fill="#667386" font-size="17" font-weight="400" text-anchor="start">One patient and visit</text>
<text x="60" y="295" fill="#667386" font-size="17" font-weight="400" text-anchor="start">Current role and care scope</text>
<path d="M295 174 H325" fill="none" stroke="#8090a5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="357" cy="173" r="20" fill="#1c4286" stroke="none" stroke-width="1"/>
<text x="357" y="180" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">2</text>
<text x="337" y="232" fill="#202b3a" font-size="23" font-weight="600" text-anchor="start">Collect sources</text>
<text x="337" y="268" fill="#667386" font-size="17" font-weight="400" text-anchor="start">Authorized fields and notes</text>
<text x="337" y="295" fill="#667386" font-size="17" font-weight="400" text-anchor="start">Visible omissions and citations</text>
<path d="M572 174 H602" fill="none" stroke="#8090a5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="634" cy="173" r="20" fill="#1c4286" stroke="none" stroke-width="1"/>
<text x="634" y="180" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">3</text>
<text x="614" y="232" fill="#202b3a" font-size="23" font-weight="600" text-anchor="start">Prepare with AI</text>
<text x="614" y="268" fill="#667386" font-size="17" font-weight="400" text-anchor="start">Source-linked facts and draft</text>
<text x="614" y="295" fill="#667386" font-size="17" font-weight="400" text-anchor="start">Private, bounded inference</text>
<path d="M849 174 H879" fill="none" stroke="#8090a5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="911" cy="173" r="20" fill="#861c42" stroke="none" stroke-width="1"/>
<text x="911" y="180" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">4</text>
<text x="891" y="232" fill="#202b3a" font-size="23" font-weight="600" text-anchor="start">Review the draft</text>
<text x="891" y="268" fill="#667386" font-size="17" font-weight="400" text-anchor="start">Open evidence and full record</text>
<text x="891" y="295" fill="#667386" font-size="17" font-weight="400" text-anchor="start">Edit and select follow-ups</text>
<path d="M1126 174 H1156" fill="none" stroke="#8090a5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="1188" cy="173" r="20" fill="#42861c" stroke="none" stroke-width="1"/>
<text x="1188" y="180" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">5</text>
<text x="1168" y="232" fill="#202b3a" font-size="23" font-weight="600" text-anchor="start">Save the work</text>
<text x="1168" y="268" fill="#667386" font-size="17" font-weight="400" text-anchor="start">New draft or follow-up</text>
<text x="1168" y="295" fill="#667386" font-size="17" font-weight="400" text-anchor="start">Link an existing open review</text>
<path d="M60 335 H1380" fill="none" stroke="#dbe2eb" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="60" y="374" fill="#202b3a" font-size="21" font-weight="500" text-anchor="start">Every save rechecks current permissions, source versions and selected actions.</text>
<text x="60" y="407" fill="#667386" font-size="18" font-weight="400" text-anchor="start">Immutable revisions + audit + idempotency preserve the original evidence and prevent duplicate effects.</text>
<rect x="60" y="447" width="1320" height="78" rx="10" fill="#f5f7fa" stroke="#dbe2eb" stroke-width="1.5"/>
<text x="84" y="478" fill="#1c4286" font-size="18" font-weight="600" text-anchor="start">Optional watch</text>
<text x="262" y="478" fill="#202b3a" font-size="18" font-weight="400" text-anchor="start">Eligible source change</text>
<path d="M465 473 H520" fill="none" stroke="#8090a5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="540" y="478" fill="#202b3a" font-size="18" font-weight="400" text-anchor="start">One new preparation</text>
<text x="84" y="507" fill="#667386" font-size="16" font-weight="400" text-anchor="start">Up to 30 minutes · at most 3 automatic runs · pristine AI-created drafts/tasks do not trigger a feedback loop</text>
<text x="60" y="555" fill="#667386" font-size="16" font-weight="400" text-anchor="start">No assistant action signs, prescribes, places an order or releases a laboratory result. Unknown / invalid outcomes remain recorded.</text>
</g></svg>
