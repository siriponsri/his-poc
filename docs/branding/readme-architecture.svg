<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">CareBalance deployed architecture</title><desc id="desc">Staff reach the same-origin React and FastAPI application through Cloudflare Access. On dr-train, PostgreSQL and file storage retain records and evidence. A separate guarded worker reads the durable queue and calls a private Typhoon service. Server-only specialist gateways reach isolated LabClear and DR services. Model and database endpoints have no public route. This is a simplified logical diagram, not a network topology or high-availability claim.</desc>
